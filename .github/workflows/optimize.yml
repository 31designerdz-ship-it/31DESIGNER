name: Optimize Today GLB Files

on:
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # باش يشوف تاريخ الـ Commits تاع اليوم

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install -g @gltf-transform/cli

      - name: Compress only today's GLB files
        run: |
          echo "Looking for GLB files modified today..."
          # يجيب كاع ملفات .glb المرفوعة ولا المعدلة اليوم في Git
          TODAY_FILES=$(git log --since="midnight" --name-only --pretty=format: | grep '\.glb$' | sort -u)

          if [ -z "$TODAY_FILES" ]; then
            echo "No GLB files uploaded or modified today."
          else
            echo "$TODAY_FILES" | while read -r f; do
              if [ -f "$f" ]; then
                echo "Optimizing today's file: $f"
                gltf-transform optimize "$f" "$f" --compress draco || true
              fi
            done
          fi

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Optimized today's 3D models"
