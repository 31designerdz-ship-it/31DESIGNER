name: Optimize GLB Files

on:
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install -g @gltf-transform/cli

      - name: Compress all GLB files
        run: |
          find . -maxdepth 1 -type f -name "*.glb" -print0 | while IFS= read -r -d '' f; do
            echo "Optimizing: $f"
            gltf-transform optimize "$f" "$f" --compress draco || true
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Optimized 3D models"
